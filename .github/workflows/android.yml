name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests (chess logic, engine, board recognition)
        run: CORE_ONLY=1 ./gradlew :core:test --no-daemon

      - name: Cache Stockfish binary
        uses: actions/cache@v4
        with:
          path: stockfish-bin
          key: stockfish-sf_17.1-armv8-ndk-v1

      - name: Build Stockfish 17.1 for Android arm64 (NDK)
        continue-on-error: true
        run: |
          set -e
          if [ ! -f stockfish-bin/libstockfish.so ]; then
            git clone --depth 1 --branch sf_17.1 https://github.com/official-stockfish/Stockfish.git sf
            export PATH="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
            make -C sf/src -j4 build ARCH=armv8 COMP=ndk
            mkdir -p stockfish-bin
            cp sf/src/stockfish stockfish-bin/libstockfish.so
          fi
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp stockfish-bin/libstockfish.so app/src/main/jniLibs/arm64-v8a/libstockfish.so
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Build APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk ChessAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ChessAI-apk
          path: ChessAI.apk

      - name: Publish as GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SF="ohne Stockfish (integrierte Engine)"
          [ -f app/src/main/jniLibs/arm64-v8a/libstockfish.so ] && SF="mit Stockfish 17.1 (arm64)"
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest ChessAI.apk --latest \
            --title "Chess AI – neuester Build (#${{ github.run_number }})" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7} auf ${GITHUB_REF_NAME}, $SF. APK auf dem Handy herunterladen und installieren (Installation aus unbekannten Quellen erlauben)." \
            --target "$GITHUB_SHA"
